<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick-Em Up!™</title>
    
    <meta property="og:title" content="Stick-Em Up!™">
    <meta property="og:description" content="stack 'em high. shoot 'em low. support the $1,000 build.">
    <meta property="og:image" content="https://stick-em-up-game.com/22222222222.png">
    <meta property="og:url" content="https://stick-em-up-game.com">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stick-em-up-game.com/22222222222.png">

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #6b5591 0%, #4a3b63 100%);
            color: #ff99cc;
            font-family: 'Space Mono', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        .tagline { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 20px; }
        .poster {
            max-width: 400px;
            width: 90%;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }
        h1 {
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 40px;
            text-transform: lowercase;
        }
        .donate-btn {
            background-color: #ff99cc;
            color: #5c4b82;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.8rem;
            text-decoration: none;
            font-weight: bold;
            text-transform: lowercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .no-promises { opacity: 0.7; font-size: 1rem; margin-top: 20px; margin-bottom: 40px; }
        .legal { font-size: 0.8rem; color: #ff99cc; opacity: 0.5; max-width: 500px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tagline">the tallest tower game</div>

        <img src="22222222222.png" alt="Stick-Em Up!" class="poster">
        
        <h1>stack 'em high.<br>shoot 'em low.</h1>
        
        <a href="https://www.paypal.com/donate/?hosted_button_id=58CCB878MAVX2" class="donate-btn">
            support the $1,000 build
        </a>

        <div class="no-promises"> a dream.</div>

        <div class="legal">
            stick-em up!™ is an independent game. not affiliated with, endorsed by, or sponsored by 3m or the post-it® brand. post-it® is a registered trademark of 3m.
        </div>
    </div>
</body>
</html>
